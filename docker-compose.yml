services:
  artex:
    # 从本仓库源码本地构建（Dockerfile 的 source stage），不拉取任何第三方预构建镜像。
    # 原上游镜像 autumn27/artex 已下架，该命名空间若被他人重新注册即可投毒。
    build:
      context: .
      target: source
      args:
        ARTEX_VERSION: ${ARTEX_VERSION:-dev}
        GOPROXY: ${GOPROXY:-}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
    image: artex:local
    pull_policy: build
    # WSL 镜像网络模式下用 host 网络：容器内 127.0.0.1 即宿主机（含 Windows 服务），
    # LLM 配置可直接填 http://127.0.0.1:<端口>/v1 访问本机 API。
    # 注意：host 模式下 ports 映射失效，服务直接监听宿主机 8787/8788。
    network_mode: host
    environment:
      ARTEX_DB_PATH: /app/data/artex.sqlite
      ARTEX_UPDATE_GITHUB_TOKEN: ${ARTEX_UPDATE_GITHUB_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    # host 网络模式下 ports 映射不生效（服务直接监听宿主机端口），保留仅作声明。
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped
